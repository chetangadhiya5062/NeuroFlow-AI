# File: pyproject.toml
# Project: NeuroFlow AI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroflow-ai"
version = "0.1.0"
description = "Enterprise-Grade Modular AI Operating Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chetan Gadhiya" }
]
keywords = [
    "ai-platform",
    "clean-architecture",
    "modular-monolith",
    "agentic-ai",
    "workflow-engine",
    "rag",
    "knowledge-graph",
    "llm-orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "import-linter>=2.0",
]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linter & Formatter)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "ERA", # eradicate (commented-out code)
    "PLE", # Pylint errors
    "PLW", # Pylint warnings
    "RUF", # Ruff-specific rules
]
ignore = [
    "COM812", # trailing comma missing (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ------------------------------------------------------------------------------
# MyPy Configuration (Static Type Checker)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests with mocked dependencies (no I/O)",
    "integration: Integration tests requiring real infrastructure (Docker Compose)",
    "contract: Contract conformance tests for IXxxPort adapters",
    "e2e: End-to-end vertical slice tests",
]

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 0
show_missing = true

# ------------------------------------------------------------------------------
# Import Linter Configuration (Clean Architecture Layer Boundary Rules)
# ------------------------------------------------------------------------------
[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Clean Architecture Layer Inversion Contract"
type = "layers"
layers = [
    "api",
    "services",
    "agent_runtime | workflow_engine | rag_runtime | prompt_runtime | tool_runtime | integration_runtime | knowledge_base | knowledge_graph | memory_layer | llm_gateway",
    "database | infrastructure",
    "core",
]
